default:
- enabled-by: true
  value: 0x0003f800
description: |
  One bit per GPIO the board must not let an application drive, so bit n
  reserves GPIO n.  rtems_gpio_pin_configure() refuses a reserved pin with
  EACCES before the driver is asked to do anything.

  The default reserves GPIO11, VDD_SPI, and GPIO12 to GPIO17, the SPI flash
  this part executes from: driving one of those does not produce an error, it
  produces a board that stops running.  Override it for a module with the
  flash on other pads, or to add a pad the board has tied to something.

  The console pins are reserved separately and follow
  ESPRESSIF_USE_USB_CONSOLE, so they do not need to be listed here.  A bit
  above GPIO21 or a bit also set in ESP32C3_GPIO_STRAPPING_MASK fails the
  build.
enabled-by: true
format: '{:#010x}'
links: []
name: ESP32C3_GPIO_RESERVED_MASK
type: build
